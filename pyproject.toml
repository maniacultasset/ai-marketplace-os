# Workspace root: a virtual project (no [project] table). The API manifest is
# apps/api/pyproject.toml (CANON-ADDENDUM.md §3); the contracts package is
# packages/schemas (ADR-0012). Tool config for every gate lives here.

[tool.uv]
required-version = "==0.12.19"
# Build backend pins, identical to build-constraints.txt (less pip). uv records
# them in uv.lock [manifest], so every `uv sync --frozen` builds with these.
build-constraint-dependencies = [
  "editables==0.6",
  "hatchling==1.31.0",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "trove-classifiers==2026.9.21.13",
]

[tool.uv.workspace]
members = ["apps/api", "packages/schemas", "packages/pipeline-stub"]

[dependency-groups]
dev = [
  "black==26.5.1",
  "hypothesis==6.168.3",
  "import-linter==2.15",
  "mutmut==3.8.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-randomly==5.0.0",
  "pytest-socket==0.8.1",
  "pytest-xdist==3.8.0",
  "pyyaml==6.0.3",
  "ruff==0.16.9",
  "schemathesis==4.28.0",
  "squawk-cli==2.65.0",
  "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["scaffold", "scripts/docgen", "scripts/trace", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "T20", "RUF", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"apps/api/tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"packages/schemas/tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"packages/pipeline-stub/tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"scripts/ci/**" = ["T201", "S603", "S607"]
"scripts/schemas/**" = ["T201"]
"apps/api/app_mock/__main__.py" = ["T201"]
"apps/api/app/services/embeddings.py" = ["TID251"]
"apps/api/app/services/vision.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncpg".msg = "No asyncpg: psycopg 3 is the only driver (ADR-0004)."
"redis".msg = "No Redis (ADR-0004)."
"arq".msg = "No arq: the queue is procrastinate on Postgres (ADR-0004)."
"jose".msg = "No python-jose: use PyJWT (docs/RULES.md §4)."
"passlib".msg = "No passlib: use pwdlib[argon2] (docs/RULES.md §4)."
"numpy".msg = "No numpy (docs/RULES.md §4)."
"openai".msg = "Model calls only in app/services/{embeddings,vision}.py (CANON.md:126)."
"langgraph".msg = "LangGraph belongs to the AI pipeline, not the backend (CANON.md:126)."

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "^/(scaffold|scripts/docgen|scripts/trace|docs)/"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = [
  "apps/api",
  "packages/schemas/src",
  "packages/schemas/tests",
  "packages/pipeline-stub/src",
  "packages/pipeline-stub/tests",
]
explicit_package_bases = true
mypy_path = ["apps/api", "packages/schemas/src", "packages/pipeline-stub/src"]
# Generated revision files (CANON.md:135).
exclude = ["^apps/api/alembic/versions/"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/schemas/tests", "packages/pipeline-stub/tests"]
pythonpath = ["apps/api"]
addopts = "--strict-markers --strict-config -ra --import-mode=importlib --disable-socket --allow-unix-socket"
asyncio_mode = "auto"
markers = [
  "tenant_isolation: the tenant-isolation suite; runs in its own job against mos_iso (CANON.md:137)",
  "cloudsql_mimic: 0000 and the password file on a throwaway container as a non-superuser CREATEROLE role (make bootstrap-mimic)",
  "endpoint(op_id, case, variant=None): one case of an /api/v1 operation's test matrix (S3 AC9; tests/endpoint_cases.py)",
]

[tool.coverage.run]
source = ["app"]
branch = true
