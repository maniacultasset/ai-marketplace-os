[project]
name = "mkos-schemas"
version = "2.0.0"
description = "AI Marketplace OS shared contracts (Python side of @mkos/schemas)"
requires-python = "==3.13.*"
# serialize_by_alias first appears in pydantic 2.11.0 (D12).
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkos_schemas"]
dev-mode-dirs = ["src"]
