[project]
name = "mkos-schemas"
version = "1.2.0"
description = "Contract stand-in for AI Marketplace OS seam types (schemas 1.2.0)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.13.5,<2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkos_schemas"]
