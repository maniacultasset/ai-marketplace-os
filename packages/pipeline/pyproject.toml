[project]
name = "mkos-pipeline"
version = "0.1.0"
description = "AI listing generation pipeline for AI Marketplace OS v1."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Krishna Dahale" }]
dependencies = [
  "mkos-schemas==1.2.0",
  "httpx>=0.27,<1",
  "pydantic>=2.13.5,<2.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkos_pipeline"]

[tool.uv.sources]
mkos-schemas = { path = "vendor/mkos-schemas", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
