[project]
name = "mkos-api"
version = "0.0.0"
description = "AI Marketplace OS backend API"
requires-python = "==3.13.*"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "pydantic>=2.13.5,<2.14",
  "pydantic-settings>=2.14.2",
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "starlette>=1.3.1",
  "psycopg[binary]>=3.2",
  "alembic>=1.20,<2",
  "pgvector>=0.5,<0.6",
  "procrastinate>=3.10,<3.11",
  "pillow>=12.3,<13",
  "python-multipart==0.0.32",
  "structlog>=26.1,<27",
  "sentry-sdk>=2.71,<3",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
  "mkos-schemas",
  "mkos-pipeline-stub",
  "pwdlib[argon2]==0.3.1",
  "pyjwt[crypto]>=2.15,<3",
  "cryptography==50.0.2",
  "httpx==0.28.1",
]

[tool.uv.sources]
mkos-schemas = { workspace = true }
mkos-pipeline-stub = { workspace = true }

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Local mutation run over the Rules Engine (ADR-0010 §2; S14a T16): report-only,
# `make mutation-rules`, run from apps/api so mutmut's module names match `app.*` (mutmut only
# understands ./, src/ and source/ roots). The nightly workflow is S26.
[tool.mutmut]
source_paths = ["app"]
only_mutate = ["app/services/rules_engine/*"]
pytest_add_cli_args_test_selection = ["tests/unit/rules_engine"]
pytest_add_cli_args = ["--no-cov", "-p", "no:randomly"]
also_copy = ["tests"]
