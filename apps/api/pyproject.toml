[project]
name = "mkos-api"
version = "0.0.0"
description = "AI Marketplace OS backend API"
requires-python = "==3.13.*"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "pydantic>=2.13.5,<2.14",
  "pydantic-settings>=2.14.2",
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "starlette>=1.3.1",
  "psycopg[binary]>=3.2",
  "alembic>=1.20,<2",
  "pgvector>=0.5,<0.6",
  "procrastinate>=3.10,<3.11",
  "pillow>=12.3,<13",
  "python-multipart==0.0.32",
  "structlog>=26.1,<27",
  "sentry-sdk>=2.71,<3",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
  "mkos-schemas",
  "mkos-pipeline-stub",
  "pwdlib[argon2]==0.3.1",
  "pyjwt[crypto]>=2.15,<3",
  "cryptography==50.0.2",
  "httpx==0.28.1",
  # S14b T12 (C7): `to_thread` + `CapacityLimiter` for the dry-run; already locked via starlette.
  "anyio==4.15.1",
  # S14b T17 (ARCH.md:198): the read-only staff admin; no `[auth]` extra (no itsdangerous).
  "sqladmin==0.32.0",
  "boto3==1.43.108",
  # S16 (CANON.md:126; R2): the embedding client, imported only by app/services/embeddings.py.
  "openai==3.19.1",
]

[tool.uv.sources]
mkos-schemas = { workspace = true }
mkos-pipeline-stub = { workspace = true }

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# The mutation run over the core modules (ADR-0010 §2; S14a T16; S26 PLAN D9): `make mutation`
# (`make mutation-rules` is its alias), then scripts/ci/mutation_report.py (>= 80% per module or a
# docs/review/MUTATION-WAIVERS.md row); nightly leg `mutation`, never a PR check. Run from apps/api
# so mutmut's module names match `app.*` (mutmut only understands ./, src/ and source/ roots).
# The test selection is each module's own unit and integration tests; the integration ones need
# the migrated mos_test (the Makefile passes the test env). They reset shared tables, so each
# mutmut child runs on its own slot copy of mos_test (tests/support/xdist_db.py). `-c pyproject.toml --rootdir .` keep pytest on the mutants copy's own config:
# the root config's `pythonpath = ["apps/api"]` would import the unmutated `app`, so no mutant
# would ever be hit; `-o asyncio_mode=auto` replaces the root setting the async tests need.
[tool.mutmut]
source_paths = ["app"]
only_mutate = [
  "app/services/rules_engine/*",
  "app/db/guard.py",
  "app/repositories/base.py",
  "app/services/maker_checker.py",
  "app/services/idempotency.py",
  "app/repositories/idempotency.py",
  "app/services/publish_rules.py",
  "app/services/publish_ledger.py",
  "app/services/publish.py",
]
pytest_add_cli_args_test_selection = [
  "tests/unit/rules_engine",
  "tests/unit/test_scoped_write.py",
  "tests/unit/test_repository_wiring.py",
  "tests/unit/test_maker_checker.py",
  "tests/unit/test_request_hash.py",
  "tests/unit/test_publish_rules.py",
  "tests/unit/test_publish_ledger.py",
  "tests/integration/test_guard.py",
  "tests/integration/test_repository_base.py",
  "tests/integration/test_approve_maker_checker.py",
  "tests/integration/test_idempotency.py",
  "tests/integration/test_listings_publish_api.py",
  "tests/integration/test_publish_flow.py",
  "tests/integration/test_listings_sync_reads_api.py",
  "tests/integration/test_analytics_repository.py",
  "tests/integration/test_periodic_tasks.py",
]
pytest_add_cli_args = [
  "-c",
  "pyproject.toml",
  "--rootdir",
  ".",
  "--import-mode=importlib",
  "--no-cov",
  "-p",
  "no:randomly",
  "-o",
  "asyncio_mode=auto",
]
also_copy = ["tests", "alembic", "alembic.ini"]
