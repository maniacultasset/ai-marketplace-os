[project]
name = "mkos-api"
version = "0.0.0"
description = "AI Marketplace OS backend API"
requires-python = "==3.13.*"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "pydantic>=2.13.5,<2.14",
  "pydantic-settings>=2.14.2",
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "starlette>=1.3.1",
  "psycopg[binary]>=3.2",
  "mkos-schemas",
]

[tool.uv.sources]
mkos-schemas = { workspace = true }

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
