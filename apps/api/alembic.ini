# Alembic for apps/api (CANON.md:20, :75-76). There is no sqlalchemy.url: env.py reads
# ALEMBIC_DATABASE_URL through app.core.config, and logging is configured only by the
# `python -m app.cli` entry point (env.py never calls fileConfig).
# Run from the repo root: uv run --frozen alembic -c apps/api/alembic.ini <command>
[alembic]
script_location = %(here)s/alembic
path_separator = os
# Ledger ids such as 0001_core_tenancy come from --rev-id (CANON.md:76).
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
