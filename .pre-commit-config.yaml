# Local hooks only: every tool is the pinned one from uv.lock, nothing is fetched from a hook repo.
# `make hooks` (called by `make dev`) runs `pre-commit install`, which installs both hook types below.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
exclude: ^(scaffold|scripts/docgen|scripts/trace|docs)/
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types: [python]
      - id: black
        name: black
        entry: uv run --frozen black
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: gitleaks
        name: gitleaks
        entry: scripts/ci/gitleaks.sh --staged
        language: system
        pass_filenames: false
      - id: commit-lint
        name: commit-lint
        entry: python3 scripts/ci/commit_lint.py --message-file
        language: system
        stages: [commit-msg]
      - id: commit-attribution
        name: commit-attribution
        entry: python3 scripts/ci/commit_attribution.py
        language: system
        stages: [commit-msg]
