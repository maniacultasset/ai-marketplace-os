name: py-setup
description: Install the pinned uv (checksum-verified) and sync the locked workspace.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.19"
        # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz from the 0.12.19 release checksums.
        checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
        enable-cache: true
    - run: uv sync --frozen --all-packages
      shell: bash
