# Required checks: api-lint, api-typecheck, api-tests, api-tests-integration, tenant-isolation,
# lint-imports, bootstrap.
# A job id is its check name: no job name, matrix, if or needs, because a skipped required job
# reports success (EXECUTION-PLAN.md:245-248). No paths filter (CANON.md:77). No secrets.
name: ci-api
on:
  pull_request:
    branches: [main]
permissions: {}
concurrency:
  group: ci-api-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  api-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mos_test
      JWT_SECRET: ci_only_not_a_real_secret_at_least_32_chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/py-setup
      - run: make api-lint
  api-typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mos_test
      JWT_SECRET: ci_only_not_a_real_secret_at_least_32_chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/py-setup
      - run: make api-typecheck
  api-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # the full suite took 39.1 min on the runner at S19 (KNOWN-ISSUES §E); since S26 it runs as two
    # required jobs over disjoint shards (tests/support/shard.py), each under pytest-xdist (auto,
    # at most 4 workers): this one is shard 1 with the migration round trip, and
    # api-tests-integration is shard 2. Each stays under ~25 min; 30 is the cap.
    timeout-minutes: 30
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mos_test
      JWT_SECRET: ci_only_not_a_real_secret_at_least_32_chars
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d mos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/py-setup
      - name: bootstrap extensions and roles
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/mos_test" \
            -v ON_ERROR_STOP=1 -f scripts/db/0000_bootstrap.sql
          APP_RW_SCRAM="$(make -s app-rw-scram)" psql "postgresql://postgres:postgres@localhost:5432/mos_test" \
            -v ON_ERROR_STOP=1 -X -q -f scripts/db/0000_role_passwords.sql
      # The CSV import tests read and write objects (S13b): the compose MinIO and its buckets, on
      # the local-only dev credentials of .env.example.
      - name: object storage
        env:
          S3_ACCESS_KEY: local_only_minio_root_user
          S3_SECRET_KEY: local_only_minio_root_password_32_chars
        run: |
          docker compose up -d --wait minio
          docker compose run --rm minio-init
      - run: make api-tests
  api-tests-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # shard 2 of the api suite (S26; see api-tests): the database suites shard 1 does not run.
    timeout-minutes: 30
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mos_test
      JWT_SECRET: ci_only_not_a_real_secret_at_least_32_chars
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d mos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/py-setup
      - name: bootstrap extensions and roles
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/mos_test" \
            -v ON_ERROR_STOP=1 -f scripts/db/0000_bootstrap.sql
          APP_RW_SCRAM="$(make -s app-rw-scram)" psql "postgresql://postgres:postgres@localhost:5432/mos_test" \
            -v ON_ERROR_STOP=1 -X -q -f scripts/db/0000_role_passwords.sql
      # The CSV import tests read and write objects (S13b): the compose MinIO and its buckets, on
      # the local-only dev credentials of .env.example.
      - name: object storage
        env:
          S3_ACCESS_KEY: local_only_minio_root_user
          S3_SECRET_KEY: local_only_minio_root_password_32_chars
        run: |
          docker compose up -d --wait minio
          docker compose run --rm minio-init
      - run: make api-tests-integration
  tenant-isolation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mos_iso
      JWT_SECRET: ci_only_not_a_real_secret_at_least_32_chars
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mos_iso
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d mos_iso"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/py-setup
      - name: bootstrap extensions and roles
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/mos_iso" \
            -v ON_ERROR_STOP=1 -f scripts/db/0000_bootstrap.sql
          APP_RW_SCRAM="$(make -s app-rw-scram)" psql "postgresql://postgres:postgres@localhost:5432/mos_iso" \
            -v ON_ERROR_STOP=1 -X -q -f scripts/db/0000_role_passwords.sql
      - run: make tenant-isolation
  lint-imports:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/py-setup
      - run: make lint-imports
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://app_rw:ci_only_app_rw_not_a_real_password@localhost:5432/marketplace_os
      JWT_SECRET: ci_only_not_a_real_secret_at_least_32_chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/py-setup
      - run: cp .env.example .env
      - run: make bootstrap
